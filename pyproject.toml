[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interactome"
version = "0.1.0"
description = "Overview of HuRI, merged BioPlex HEK293T, and huMAP2 networks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.67.0",
    "requests>=2.32.0",
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    "plotly>=6.0.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "networkx>=3.2.0",
    "py4cytoscape>=1.13.0",
]

[project.optional-dependencies]
clustering = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "scikit-learn>=1.4.0",
    "igraph>=0.11.0",
    "leidenalg>=0.10.0",
    "scikit-network>=0.33.0",
    "markov-clustering>=0.0.6.dev0",
]
clustering-research = [
    "cdlib>=0.4.0",
    "graspologic>=3.4.0",
    "networkit>=11.0",
    "infomap>=2.8.0",
    "hdbscan>=0.8.33",
]
test = [
    "pytest>=8.0.0",
]

[tool.setuptools]
py-modules = ["networks", "moonlighting", "cytoscape_bridge", "cluster_networks"]

[project.scripts]
interactome-cluster = "cluster_networks:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
