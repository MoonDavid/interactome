[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interactome"
version = "0.1.0"
description = "Overview of HuRI, merged BioPlex HEK293T, and huMAP2 networks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.67.0",
    "requests>=2.32.0",
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    "plotly>=6.0.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "networkx>=3.2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[tool.setuptools]
py-modules = ["networks", "moonlighting"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
